version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
  exclusions:
    rules:
      # Tests talk to httptest servers they own.
      - path: _test\.go
        linters: [gosec, noctx]
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - (*github.com/pburkhalter/journarr/internal/store.Store).Close
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Fprintln
