version: 2
# Minor and patch updates come as one PR per ecosystem, so they no longer
# fill the queue one package at a time. Majors stay separate PRs, except the
# SvelteKit family, whose majors only work together (kit, adapter, vite
# plugin, svelte, vite, TypeScript).
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      sveltekit-major:
        update-types: [major]
        patterns:
          - "@sveltejs/*"
          - svelte
          - svelte-check
          - vite
          - typescript
    ignore:
      # TypeScript 7 (the native port) crashes svelte-check, and SvelteKit's
      # peer range stops at 6. Lift once svelte-check supports it.
      - dependency-name: typescript
        versions: [">=7"]
      # @types/node follows the Node version the frontend is built with
      # (node:24-alpine, CI node-version 24); raise it together with those.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
