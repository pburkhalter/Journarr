name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
        working-directory: backend
      - run: go test -race -count=1 ./...
        working-directory: backend

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: a new linter release must not turn CI red without a code change.
          version: v2.15.0
          working-directory: backend

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26"
          work-dir: backend
          go-package: ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The built frontend is committed (backend/internal/web/dist) and
      # embedded into the binary. A stale commit means the image ships an
      # older UI than the source, so this fails the build. `git status`
      # also sees new hashed files the commit is missing, which `git diff`
      # does not.
      - name: committed frontend build is current
        run: |
          changes="$(git status --porcelain --untracked-files=all -- backend/internal/web/dist)"
          if [ -n "$changes" ]; then
            echo "::error::backend/internal/web/dist is stale: run 'make frontend' and commit the result"
            echo "$changes"
            exit 1
          fi
